name: Documentation
description: Proponer una mejora, corrección o ampliación de la documentación.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Ubicación
      description: Indica el archivo, sección o enlace que debe cambiarse.
      placeholder: "README.md, src/lessons/..."
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Problema documental
      description: Explica qué falta, qué es incorrecto o qué resulta confuso.
      placeholder: Actualmente la documentación...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      description: Describe el contenido o cambio esperado.
      placeholder: Debería documentarse...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: Define cómo verificaremos que la documentación está completa.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
